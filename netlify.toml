[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Long-lived caching for fingerprinted assets ONLY. Astro puts a content hash in every
# /_astro/ filename, so a changed file is a changed URL and "immutable" is safe.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OG cards are NOT fingerprinted — /og/medflow.png keeps its name when its content
# changes. "immutable" here would pin a stale card for a year after any edit to a
# project's title or description. One day, then revalidate.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
